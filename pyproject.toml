[project]
name = "fraud-review-bedrock"
version = "0.1.0"
description = "A fraud-review agent on Amazon Bedrock that triages card alerts, explains each decision against a written policy and sends uncertain cases to a person."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "markdown-it-py>=3",  # policy.md is read as CommonMark, the way a reviewer sees it
    "pandas>=2.2",
    "pyarrow>=17",
    "anthropic[bedrock]>=1",
    "botocore[crt]>=1.44.3",
    "lightgbm>=4",
    "shap>=0.46",
    "scipy>=1.13",
    "numpy>=1.26",
    "evalkit-harness[anthropic,openai]==0.4.1",  # PyPI release, the v0.4.1 tag (B5.2, B5.13, v0.2 lane A)
]

[project.urls]
Homepage = "https://github.com/biplob819/fraud-review-bedrock"

[project.entry-points."evalkit.scorers"]
clause_valid = "fraudreview.scorers:clause_valid"
field_valid = "fraudreview.scorers:field_valid"
protected_clean = "fraudreview.scorers:protected_clean"
driver_agreement = "fraudreview.scorers:driver_agreement"
value_outcome = "fraudreview.scorers:value_outcome"
rule_compliant = "fraudreview.scorers:rule_compliant"

[project.scripts]
fraud = "fraudreview.cli:main"

[project.optional-dependencies]
demo = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20261113",
    "openpyxl>=3.1.5",
    "pillow>=11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudreview"]

[tool.hatch.build.targets.sdist]
include = ["src/fraudreview", "README.md", "LICENSE", "NOTICE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md", ".claude"]  # agent worktrees live under .claude/worktrees

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.ruff.lint.per-file-ignores]
"src/fraudreview/report.py" = ["E501"]  # inline SVG and CSS strings
"scripts/build_roi.py" = ["E501"]  # wide table of input rows and sheet text

[tool.pyright]
include = ["src", "scripts", "tests", "demo"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, CLI, policy-file and EvalKit-import contract tests",
    "golden: end-to-end replay of recorded Bedrock replies",
    "safety: privacy allow-list, label isolation, no tools, secrets",
]
