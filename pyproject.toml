[project]
name = "fraud-review-bedrock"
version = "0.0.1"
description = "A fraud-review agent on Amazon Bedrock that triages card alerts, explains each decision against a written policy and sends uncertain cases to a person."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "markdown-it-py>=3",  # policy.md is read as CommonMark, the way a reviewer sees it
    "pandas>=2.2",
    "pyarrow>=17",
    "anthropic[bedrock]>=1",
    "botocore[crt]>=1.44.3",
    "lightgbm>=4",
    "shap>=0.46",
    "scipy>=1.13",
    "numpy>=1.26",
    "evalkit-harness @ git+https://github.com/biplob819/evalkit@118b661f570b412c952df48736e59d16b6455a6d",  # v0.3.0 release candidate (B5.2, B5.13); moves to the tag
]

[project.urls]
Homepage = "https://github.com/biplob819/fraud-review-bedrock"

[project.scripts]
fraud = "fraudreview.cli:main"

[project.optional-dependencies]
demo = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # EvalKit is pinned to an exact commit on GitHub

[tool.hatch.build.targets.wheel]
packages = ["src/fraudreview"]

[tool.hatch.build.targets.sdist]
include = ["src/fraudreview", "README.md", "LICENSE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md", ".claude"]  # agent worktrees live under .claude/worktrees

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests", "demo"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, CLI, policy-file and EvalKit-import contract tests",
    "golden: end-to-end replay of recorded Bedrock replies",
    "safety: privacy allow-list, label isolation, no tools, secrets",
]
