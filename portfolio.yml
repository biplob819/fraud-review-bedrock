priorities:
  # built: core of the project
  - item: "Code router that decides every auto-clear, not the model"
    call: built
    why: "A model's clear is only a proposal; the router accepts it when a cited policy clause holds in code."
    source: "TECH_SPEC.md D-5"
  - item: "Written policy as numbered, machine-checked clauses"
    call: built
    why: "Each clause has a condition on a few allowed fields, so a clear can be checked against the alert."
    source: "TECH_SPEC.md D-6; policy.md"
  - item: "Two-stage triage: fast screen, then careful review"
    call: built
    why: "Haiku 5.5 screens each alert and Sonnet 5.5 reviews what it will not clear."
    source: "docs/case-study.md"
  - item: "Hash-chained audit log of every decision"
    call: built
    why: "Every step is recorded so that edits to the log are detected."
    source: "README.md"
  - item: "Evaluation on a fresh set of 500 alerts"
    call: built
    why: "After the first eval leaked 2 of 79 frauds, the fix was proven on a fresh sample: 0 of 55 (simulated data)."
    source: "TECH_SPEC.md D-39, D-40; docs/measurements/summary-eval2.json"
  - item: "Analyst review screen and results dashboard"
    call: built
    why: "A replay demo shows reasons beside the evidence, and a dashboard shows the results (simulated data)."
    source: "demo/README.md; docs/dashboard.html"
  - item: "Spend cap that holds across reruns"
    call: built
    why: "After a judging run overspent, the cap became a total across reruns and a lock stops overlapping runs."
    source: "TECH_SPEC.md D-43; changelog.md"
  # cut: deliberately dropped or descoped
  - item: "Running the published results on Amazon Bedrock"
    call: cut
    why: "The AWS project could not enable Claude, so the published runs used the Claude API; Bedrock stays supported but untested."
    source: "TECH_SPEC.md D-35"
  - item: "The 90-second project video"
    call: cut
    why: "The owner dropped it; a looping walkthrough GIF and the write-up stand in for it."
    source: "TECH_SPEC.md D-45"
  - item: "Blocking a card or contacting customers"
    call: cut
    why: "The agent has no such tool; it recommends and people decide."
    source: "docs/case-study.md"
  - item: "EvalKit's own value check for the agent's numbers"
    call: cut
    why: "It returned false claims as verified, so this project uses its own strict check."
    source: "TECH_SPEC.md D-42"
  # later: planned, not built
  - item: "Hosted demo with passkey sign-in"
    call: later
    why: "The replay demo is hosted, but the passkey version is not built."
    source: "TECH_SPEC.md D-44; README.md"
  - item: "Second faithfulness judge and calibration against human labels"
    call: later
    why: "Only one judge gave verdicts, and it was never checked against human labels."
    source: "docs/case-study.md; docs/measurements/faithfulness-cache-summary.json"
  - item: "A much larger labelled sample before quoting any saving"
    call: later
    why: "0 leaks in 55 frauds cannot rule out a 5.3% rate, so the ROI model shows no payback."
    source: "docs/case-study.md; docs/roi/README.md"
  - item: "Real data in place of simulated data"
    call: later
    why: "Every published number is on simulated data; real data would replace all illustrative inputs."
    source: "DATA_CARD.md; docs/case-study.md"
