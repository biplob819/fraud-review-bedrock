# List prices for the run models, US dollars per million tokens, one table per provider (D-27).
# anthropic: the Claude API rate card (D-35, the provider used for the published results).
# bedrock: in-Region us-east-2 (D-34, 10% above the global rate). Source: the model agreement
#   rate card, `aws bedrock list-foundation-model-agreement-offers --model-id <id> --region
#   us-east-2`, dimensions USE2_*_standard.
checked: "2026-11-17"
currency: USD
unit: per_million_tokens
