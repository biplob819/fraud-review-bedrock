name: release

# Build the wheel and source archive for a pushed version tag, run the tests, and attach both to a
# GitHub release. It never publishes to PyPI (D-26): that needs the owner's separate approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # only to create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tag is not on main" >&2; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv sync --locked --all-extras  # the demo tests need Streamlit
      - run: uv run pytest -q
      - run: uv build
      - name: Write the release notes from the changelog
        run: uv run python scripts/changelog_section.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create the GitHub release with the wheel and source archive
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --verify-tag
