name: pages

# Rebuild the results dashboard from the committed summary and publish it to GitHub Pages.
# Runs on pushes to main only (and by hand); never on pull requests, so a fork cannot reach it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Render the dashboard from the committed summary
        run: >
          uv run fraud report
          --summary docs/measurements/summary-eval2.json
          --history docs/measurements/runs.jsonl
          --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
