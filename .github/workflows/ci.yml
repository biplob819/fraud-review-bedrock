name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-managed  # same patch-level Python everywhere, never the runner's
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - name: OpenMP runtime for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --locked
      - run: uv sync --locked --extra demo  # streamlit, which pyright reads in demo/app.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python scripts/secret_scan.py
      - run: uv run python scripts/verify_graph_eligibility.py
      - run: uv run python scripts/honesty_check.py
      - run: uv build
