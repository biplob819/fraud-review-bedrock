<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-labelledby="t d">
  <title id="t">fraud-review-bedrock reference architecture</title>
  <desc id="d">What was built and ran: a local Python CLI with a LightGBM baseline, a router and policy-as-code, a content-addressed cache, a spend cap and ledger and a hash-chained audit log, calling the Claude API with Haiku 5.5 for stage 1 and Sonnet 5.5 for stage 2. Supported but not run: Amazon Bedrock through the in-Region Mantle endpoint in us-east-2. Proposed for an AWS pilot, all in us-east-2: alerts in S3, EventBridge starting a Step Functions workflow of Lambda tasks inside an IAM boundary, DynamoDB for decisions and audit events streamed to S3 with Object Lock, an analyst queue app, CloudWatch, KMS, and a passkey-protected hosted demo on a Lambda function URL with DynamoDB.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.5;rx:10}
      .agent{fill:#eef2ff;stroke:#4f46e5;stroke-dasharray:2 3}
      .gate{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:8 5}
      .out{fill:#ecfdf5;stroke:#047857}
      .eval{fill:#f1f5f9;stroke:#475569;stroke-dasharray:5 4}
      .panel{fill:#ffffff;stroke:#334155;stroke-width:2;rx:14}
      .h{font:600 15px system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0f172a}
      .s{font:13px system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#334155}
      .note{font:italic 12px system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#64748b}
      .iam{font:600 14px system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#92400e}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke:#94a3b8;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1400" height="940" fill="#ffffff"/>
  <text x="40" y="38" class="h" style="font-size:20px">Reference architecture: what ran, and an AWS pilot</text>
  <text x="40" y="60" class="note">All data is simulated. The agent recommends; people decide. Everything on AWS stays in us-east-2: no cross-Region calls or resources.</text>

  <!-- built: local machine -->
  <rect x="40" y="90" width="380" height="510" class="panel"/>
  <text x="60" y="116" class="h">Local machine (built, ran)</text>

  <rect x="60" y="130" width="340" height="78" class="box out"/>
  <text x="76" y="154" class="h">Local Python CLI</text>
  <text x="76" y="174" class="s">fraud load, fraud baseline, fraud triage,</text>
  <text x="76" y="192" class="s">fraud freeze, fraud doctor</text>

  <rect x="60" y="222" width="340" height="60" class="box out"/>
  <text x="76" y="246" class="h">LightGBM baseline</text>
  <text x="76" y="266" class="s">point-in-time features, SHAP top 5</text>

  <rect x="60" y="296" width="340" height="60" class="box out"/>
  <text x="76" y="320" class="h">Router and policy-as-code</text>
  <text x="76" y="340" class="s">policy.md clauses checked in code</text>

  <rect x="60" y="370" width="340" height="60" class="box out"/>
  <text x="76" y="394" class="h">Content-addressed cache</text>
  <text x="76" y="414" class="s">model replies keyed by request hash</text>

  <rect x="60" y="444" width="340" height="60" class="box out"/>
  <text x="76" y="468" class="h">Spend cap and ledger</text>
  <text x="76" y="488" class="s">cap checked before every model call</text>

  <rect x="60" y="518" width="340" height="60" class="box out"/>
  <text x="76" y="542" class="h">Hash-chained audit log</text>
  <text x="76" y="562" class="s">JSONL; any edit is detected</text>

  <!-- built: Claude API -->
  <rect x="40" y="660" width="380" height="104" class="box out"/>
  <text x="56" y="686" class="h">Claude API (Anthropic)</text>
  <text x="56" y="708" class="s">stage 1: Claude Haiku 5.5</text>
  <text x="56" y="726" class="s">stage 2: Claude Sonnet 5.5</text>
  <text x="56" y="746" class="note">the published results ran here (D-35)</text>
  <path d="M230 600 V656" class="ln"/>
  <text x="242" y="634" class="note">HTTPS, key from git-ignored .env</text>

  <!-- AWS project boundary -->
  <rect x="470" y="90" width="890" height="700" class="panel" style="stroke-width:2.5"/>
  <text x="490" y="116" class="h">AWS project: Region us-east-2 only</text>

  <!-- supported: Bedrock Mantle -->
  <rect x="490" y="134" width="310" height="104" class="box agent"/>
  <text x="506" y="158" class="h">Amazon Bedrock (Mantle)</text>
  <text x="506" y="178" class="s">bedrock-mantle.us-east-2, in-Region</text>
  <text x="506" y="196" class="s">Haiku 5.5 and Sonnet 5.5 ids</text>
  <text x="506" y="224" class="note">supported, not run (D-27, D-34)</text>
  <path d="M400 168 H486" class="dash"/>
  <text x="434" y="156" class="note" text-anchor="middle">optional</text>

  <!-- proposed: hosted demo -->
  <rect x="840" y="134" width="250" height="122" class="box eval"/>
  <text x="856" y="158" class="h">Hosted demo: Lambda</text>
  <text x="856" y="178" class="s">function URL; passkey sign-in</text>
  <text x="856" y="196" class="s">for everyone; replay, or live triage</text>
  <text x="856" y="214" class="s">(owner passcode or own key)</text>
  <text x="856" y="242" class="note">proposed (D-31)</text>

  <rect x="1120" y="134" width="220" height="122" class="box eval"/>
  <text x="1136" y="158" class="h">Amazon DynamoDB</text>
  <text x="1136" y="178" class="s">demo passkeys and</text>
  <text x="1136" y="196" class="s">spend ledger</text>
  <text x="1136" y="242" class="note">proposed (D-31)</text>
  <path d="M1090 195 H1116" class="dash"/>
  <path d="M840 205 H804" class="dash"/>

  <!-- proposed pilot workflow inside IAM boundary -->
  <rect x="490" y="280" width="850" height="340" rx="12" class="gate"/>
  <text x="508" y="304" class="iam">IAM boundary: pilot workflow role (proposed)</text>
  <text x="508" y="322" class="note">May invoke only the two in-Region Bedrock models. No permission on any card system.</text>

  <rect x="510" y="340" width="160" height="80" class="box eval"/>
  <text x="526" y="366" class="h">Amazon S3</text>
  <text x="526" y="388" class="s">alerts land here</text>

  <rect x="700" y="340" width="200" height="80" class="box eval"/>
  <text x="716" y="366" class="h">Amazon EventBridge</text>
  <text x="716" y="388" class="s">starts the workflow</text>

  <rect x="930" y="340" width="390" height="120" class="box eval"/>
  <text x="946" y="366" class="h">AWS Step Functions</text>
  <text x="946" y="388" class="s">Lambda tasks with retries and timeouts:</text>
  <text x="946" y="408" class="s">stage 1, router, stage 2, router again</text>
  <text x="946" y="428" class="s">(router and policy run as code)</text>

  <path d="M670 380 H696" class="dash"/>
  <path d="M900 380 H926" class="dash"/>
  <path d="M1250 340 V266 H700 V242" class="dash"/>
  <text x="1260" y="306" class="note">stage calls</text>

  <rect x="1060" y="490" width="260" height="90" class="box eval"/>
  <text x="1076" y="516" class="h">Amazon DynamoDB</text>
  <text x="1076" y="538" class="s">decisions and audit events</text>
  <text x="1076" y="556" class="s">(held cases for review)</text>

  <rect x="700" y="490" width="300" height="90" class="box eval"/>
  <text x="716" y="516" class="h">Amazon S3 with Object Lock</text>
  <text x="716" y="538" class="s">write-once audit copy</text>
  <text x="716" y="556" class="s">fed by the DynamoDB stream</text>

  <path d="M1190 460 V486" class="dash"/>
  <path d="M1060 535 H1004" class="dash"/>
  <text x="1032" y="527" class="note" text-anchor="middle">stream</text>

  <!-- proposed: outside the workflow role -->
  <rect x="490" y="650" width="260" height="90" class="box eval"/>
  <text x="506" y="676" class="h">Analyst queue app</text>
  <text x="506" y="698" class="s">reads held cases;</text>
  <text x="506" y="716" class="s">a person decides</text>

  <rect x="780" y="650" width="270" height="90" class="box eval"/>
  <text x="796" y="676" class="h">Amazon CloudWatch</text>
  <text x="796" y="698" class="s">volumes, cost, errors and</text>
  <text x="796" y="716" class="s">leakage on reviewed cases</text>

  <rect x="1080" y="650" width="260" height="90" class="box eval"/>
  <text x="1096" y="676" class="h">AWS KMS</text>
  <text x="1096" y="698" class="s">keys on S3 and DynamoDB</text>

  <path d="M1110 580 V600 H620 V646" class="dash"/>
  <text x="866" y="594" class="note" text-anchor="middle">held cases</text>
  <text x="490" y="770" class="note">Model risk review comes before any pilot.</text>

  <!-- legend -->
  <rect x="40" y="810" width="1320" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="836" class="h">Legend</text>
  <rect x="60" y="850" width="34" height="18" class="box out"/>
  <text x="106" y="864" class="s"><tspan font-weight="600">Built (ran):</tspan> local Python CLI, Claude API (Haiku 5.5, Sonnet 5.5), router and policy-as-code, hash-chained audit log, content-addressed cache, spend cap and ledger, LightGBM baseline</text>
  <rect x="60" y="874" width="34" height="18" class="box agent"/>
  <text x="106" y="888" class="s"><tspan font-weight="600">Supported (not run):</tspan> Amazon Bedrock through the in-Region Mantle endpoint in us-east-2</text>
  <rect x="60" y="898" width="34" height="18" class="box eval"/>
  <text x="106" y="912" class="s"><tspan font-weight="600">Proposed (pilot):</tspan> every other AWS service drawn here, including the passkey-protected hosted demo. Amber dashes mark the IAM boundary.</text>
</svg>
