# Run configuration (Tech Spec §3). Model ids are verified by `fraud doctor` (W0.2).
provider: anthropic         # D-35: the Claude API; bedrock is the other choice (D-27)
region: us-east-2           # D-34: used when provider is bedrock (in-Region endpoint)
stage1:
  model: claude-haiku-5-5             # D-35; on Bedrock: anthropic.claude-haiku-5-5
  effort: medium                      # D-16
  max_output_tokens: 4096
stage2:
  model: claude-sonnet-5-5            # D-35; on Bedrock: anthropic.claude-sonnet-5-5
  effort: high                        # D-16
  max_output_tokens: 8192
clear_ceiling: 0.045       # router rule 5 (OWNER D-39): no auto-clear at or above this risk score
clear_min_confidence: 0.7   # router rule 6, stage 2 only
concurrency: 8              # within the recorded limit (docs/measurements/preflight.json)
seed: 20261115
max_cost_usd: 5             # OWNER D-33: ask before any run over $5
thresholds:
  - metric: leakage         # OWNER D-10: no fraud auto-cleared
    op: "=="
    value: 0
alarms:                     # MON-02 alarm bands (fraudreview.monitor); leakage > 0 always fails
  - metric: schema_error_rate     # schema errors per scored alert
    warn_above: 0.01
    fail_above: 0.05
  - metric: refusal_rate          # refusals per scored alert
    warn_above: 0.01
    fail_above: 0.05
  - metric: cost_per_1000_usd     # $5 per 500-alert run (D-33) is $10 per 1,000
    warn_above: 8
    fail_above: 10
  - metric: latency_p95_stage2_ms
    warn_above: 10000
    fail_above: 20000
  - metric: auto_clear_rate       # the price of automation (D-40)
    warn_below: 0.1
  - metric: auto_clear_precision
    warn_below: 0.98
    fail_below: 0.95
